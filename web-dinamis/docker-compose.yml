services:

  db-webdinamis:
    image: mariadb:lts
    environment:
      MARIADB_ROOT_PASSWORD: password!123
      MARIADB_DATABASE: dbcompro_2388010038
      MARIADB_USER: zaidan
      MARIADB_PASSWORD: zaidan07
    volumes:
      - db_data:/var/lib/mysql
      - ./db_data/dbcompro_2388010038.sql:/docker-entrypoint-initdb.d/dbcompro_2388010038.sql:ro
