name: Deploy Web Dinamis to AWS EC0

on:
  push:
    branches: [ main ]
    paths: 
      - 'web-dinamis/**'
      - '.github/workflows/deploy-dinamis.yml'
  
jobs:
  build-and-deploy-web-dinamis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push Docker image
        uses: docker/build-push-action@v5.3.0
        with:
          context: ./web-dinamis
          file: ./web-dinamis/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/web-dinamis_2388010038:latest
      
  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-and-deploy-web-dinamis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Compose file EC2 via SCP 
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          source: "web-dinamis/docker-compose.yml,web-dinamis/db_data/dbcompro_2388010038.sql"
          target: "/home/ubuntu/container-dinamis"

      - name: Deploy Web Dinamis via SSH and run docker compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/container-dinamis/web-dinamis
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            
            # Matikan dan hapus container lama beserta networknya agar tidak bentrok port (Pengganti docker rm)
            docker compose down --remove-orphans
            
            # Tarik image terbaru
            docker compose pull
            
            # Nyalakan kembali di background
            docker compose up -d
            # update untuk trigger